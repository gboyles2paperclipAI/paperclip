name: Help2day PR Verify

on:
  pull_request:
    branches:
      - help2day/main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: help2day-pr-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guardrails:
    name: Help2day guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9.15.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Help2day MVP guardrails
        run: node .github/scripts/check-help2day-mvp-guardrails.mjs

      - name: Test stable-runner shard partition
        run: node --test scripts/__tests__/run-vitest-stable-shard.test.mjs

      - name: Test package scanner and canonical release guards
        run: node --test scripts/check-forbidden-tokens.test.mjs

      - name: Check diff whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "$BASE_SHA...$HEAD_SHA"
          else
            git diff --check
          fi

      - name: Fail if conflict markers exist in PR diff
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          start_marker="$(printf '<%.0s' {1..7})"
          middle_marker="$(printf '=%.0s' {1..7})"
          end_marker="$(printf '>%.0s' {1..7})"
          if git diff --unified=0 "$BASE_SHA...$HEAD_SHA" | awk '
            index($0, "+" start_marker) == 1 || $0 == "+" middle_marker || index($0, "+" end_marker) == 1 {
              print
              found = 1
            }
            END { exit found ? 0 : 1 }
          ' start_marker="$start_marker" middle_marker="$middle_marker" end_marker="$end_marker"; then
            echo "Conflict markers found in PR diff."
            exit 1
          fi

      - name: Print PR change summary
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "Changed files: $(git diff --name-only "$BASE_SHA...$HEAD_SHA" | wc -l)"
          echo "Commits: $(git rev-list --count "$BASE_SHA..$HEAD_SHA")"

  full_typecheck:
    name: Full workspace typecheck
    needs: [guardrails]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.4
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck

  build:
    name: Full build
    needs: [guardrails]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.4
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  general_tests:
    name: General tests (${{ matrix.group_label }})
    needs: [guardrails]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: general-server
            group_label: server (1/3)
            shard_index: 0
            shard_count: 3
          - group: general-server
            group_label: server (2/3)
            shard_index: 1
            shard_count: 3
          - group: general-server
            group_label: server (3/3)
            shard_index: 2
            shard_count: 3
          - group: general-workspaces-a
            group_label: workspaces-a
          - group: general-workspaces-b
            group_label: workspaces-b

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.4
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run grouped general test suites
        run: |
          if [ -n "${{ matrix.shard_count }}" ]; then
            pnpm test:run:general -- --group '${{ matrix.group }}' \
              --shard-index ${{ matrix.shard_index }} --shard-count ${{ matrix.shard_count }}
          else
            pnpm test:run:general -- --group '${{ matrix.group }}'
          fi

  serialized_tests:
    name: Serialized server tests (${{ matrix.shard_label }})
    needs: [guardrails]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard_index: 0
            shard_count: 4
            shard_label: 1/4
          - shard_index: 1
            shard_count: 4
            shard_label: 2/4
          - shard_index: 2
            shard_count: 4
            shard_label: 3/4
          - shard_index: 3
            shard_count: 4
            shard_label: 4/4

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.4
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run serialized server test shard
        run: >-
          pnpm test:run:serialized --
          --shard-index ${{ matrix.shard_index }}
          --shard-count ${{ matrix.shard_count }}

  verify:
    name: Help2day PR Verify
    if: ${{ always() }}
    needs: [guardrails, full_typecheck, build, general_tests, serialized_tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every split verification lane
        env:
          GUARDRAILS_RESULT: ${{ needs.guardrails.result }}
          FULL_TYPECHECK_RESULT: ${{ needs.full_typecheck.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          GENERAL_TESTS_RESULT: ${{ needs.general_tests.result }}
          SERIALIZED_TESTS_RESULT: ${{ needs.serialized_tests.result }}
        run: |
          test "$GUARDRAILS_RESULT" = "success"
          test "$FULL_TYPECHECK_RESULT" = "success"
          test "$BUILD_RESULT" = "success"
          test "$GENERAL_TESTS_RESULT" = "success"
          test "$SERIALIZED_TESTS_RESULT" = "success"
