name: Help2day Source Release Evidence

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Full commit SHA to validate. Branch names and moving tags are not accepted.
        required: true
        type: string
      version:
        description: Governed version in YYYY.MDD.P-help2day.N form.
        required: true
        type: string
      upstream_base:
        description: Full frozen public-upstream commit SHA.
        required: true
        type: string
      fork_anchor:
        description: Full company-fork anchor commit SHA.
        required: true
        type: string
      upstream_provenance_commit:
        description: Exact reviewed reconciliation PR head whose tree was merged.
        required: true
        type: string
      reconciliation_merge_commit:
        description: Exact squash merge commit with a tree equal to the reviewed PR head.
        required: true
        type: string

concurrency:
  group: help2day-source-release-${{ inputs.source_ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  evidence:
    name: Immutable source-release evidence
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: source-release

    steps:
      - name: Reject a moving source reference
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          if [[ ! "$SOURCE_REF" =~ ^[0-9a-f]{40}$|^[0-9a-f]{64}$ ]]; then
            echo "source_ref must be a full lowercase commit SHA" >&2
            exit 1
          fi

      - name: Checkout exact source commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref }}

      - name: Fetch immutable reconciliation lineage
        env:
          UPSTREAM_BASE: ${{ inputs.upstream_base }}
          UPSTREAM_PROVENANCE_COMMIT: ${{ inputs.upstream_provenance_commit }}
          RECONCILIATION_MERGE_COMMIT: ${{ inputs.reconciliation_merge_commit }}
        run: |
          for commit in "$UPSTREAM_BASE" "$UPSTREAM_PROVENANCE_COMMIT" "$RECONCILIATION_MERGE_COMMIT"; do
            [[ "$commit" =~ ^[0-9a-f]{40}$|^[0-9a-f]{64}$ ]] || exit 1
          done
          git fetch --no-tags origin refs/pull/86/head
          test "$(git rev-parse FETCH_HEAD)" = "$UPSTREAM_PROVENANCE_COMMIT"
          git update-ref refs/release-evidence/upstream-provenance "$UPSTREAM_PROVENANCE_COMMIT"
          git fetch --no-tags https://github.com/paperclipai/paperclip.git "$UPSTREAM_BASE"
          test "$(git rev-parse FETCH_HEAD)" = "$UPSTREAM_BASE"
          git update-ref refs/release-evidence/upstream-base "$UPSTREAM_BASE"
          git cat-file -e "$RECONCILIATION_MERGE_COMMIT^{commit}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.3
          cache: pnpm

      - name: Setup Go for pinned scanners
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.2
          cache: false

      - name: Install exact repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Install maintained scanners at governed versions
        env:
          GOBIN: ${{ runner.temp }}/release-tools/bin
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          RIPGREP_VERSION: 15.1.0
          RIPGREP_LINUX_X64_SHA256: 1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599
        run: |
          mkdir -p "$GOBIN"
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.3.8
          go install github.com/anchore/grype/cmd/grype@v0.110.0
          GITLEAKS_ARCHIVE="${{ runner.temp }}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --proto '=https' --tlsv1.2 --retry 3 --fail --location --silent --show-error \
            --output "$GITLEAKS_ARCHIVE" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$GITLEAKS_ARCHIVE" | sha256sum --check -
          tar -xzf "$GITLEAKS_ARCHIVE" -C "$GOBIN" gitleaks
          RIPGREP_ROOT="ripgrep-${RIPGREP_VERSION}-x86_64-unknown-linux-musl"
          RIPGREP_ARCHIVE="${{ runner.temp }}/${RIPGREP_ROOT}.tar.gz"
          curl --proto '=https' --tlsv1.2 --retry 3 --fail --location --silent --show-error \
            --output "$RIPGREP_ARCHIVE" \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/${RIPGREP_ROOT}.tar.gz"
          printf '%s  %s\n' "$RIPGREP_LINUX_X64_SHA256" "$RIPGREP_ARCHIVE" | sha256sum --check -
          tar -xzf "$RIPGREP_ARCHIVE" -C "$GOBIN" --strip-components=1 "$RIPGREP_ROOT/rg"
          echo "$GOBIN" >> "$GITHUB_PATH"

      - name: Record scanner versions
        run: |
          osv-scanner --version
          grype version
          gitleaks version
          rg --version
          node_modules/.bin/cyclonedx-npm --version

      - name: Build exact evidence bundle
        id: evidence
        continue-on-error: true
        env:
          EVIDENCE_ROOT: ${{ runner.temp }}/help2day-source-release-evidence
          VERSION: ${{ inputs.version }}
          UPSTREAM_BASE: ${{ inputs.upstream_base }}
          FORK_ANCHOR: ${{ inputs.fork_anchor }}
          UPSTREAM_PROVENANCE_COMMIT: ${{ inputs.upstream_provenance_commit }}
          RECONCILIATION_MERGE_COMMIT: ${{ inputs.reconciliation_merge_commit }}
          BUILDER_ID: github:${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          ./scripts/build-help2day-release-evidence.sh \
            --version "$VERSION" \
            --output "$EVIDENCE_ROOT" \
            --upstream-base "$UPSTREAM_BASE" \
            --fork-anchor "$FORK_ANCHOR" \
            --upstream-provenance-commit "$UPSTREAM_PROVENANCE_COMMIT" \
            --reconciliation-merge-commit "$RECONCILIATION_MERGE_COMMIT" \
            --build-timestamp "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
            --builder-id "$BUILDER_ID"

      - name: Upload immutable evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: help2day-source-release-${{ inputs.source_ref }}
          path: ${{ runner.temp }}/help2day-source-release-evidence/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: Enforce evidence result
        if: steps.evidence.outcome != 'success'
        run: |
          echo "Source-release evidence did not pass. Inspect the retained bundle." >&2
          exit 1
